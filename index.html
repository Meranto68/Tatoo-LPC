<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes Flashs">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">
<title>Mes Flashs</title>
<style>
  :root { --bg:#111; --card:#1e1e1e; --txt:#eee; --acc:#c9a24a; --mute:#333; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,system-ui,"Apple Color Emoji",sans-serif;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px 6px; }
  #brand { flex:1; display:flex; align-items:center; gap:12px; min-width:0; }
  #logo { width:56px; height:56px; border-radius:50%; object-fit:cover; }
  #title { margin:0; font-size:28px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px;
           background:var(--mute); color:var(--txt); cursor:pointer; }
  button.primary { background:var(--acc); color:#111; font-weight:600; }
  button.danger { background:#b3261e; color:#fff; }
  .icon { font-size:22px; width:46px; height:46px; padding:0; }
  body.locked .admin { display:none !important; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:8px 16px; scrollbar-width:none; }
  .chips.wrap { flex-wrap:wrap; overflow:visible; padding:8px 0; justify-content:center; }
  .chip { white-space:nowrap; border-radius:999px; padding:10px 18px; background:var(--mute); font-size:17px; }
  .chip.on { background:var(--acc); color:#111; font-weight:600; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; padding:8px 16px 40px; }
  .tile { position:relative; }
  .tile img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; display:block; background:var(--card); }
  .price { position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.75); color:var(--acc);
           padding:4px 10px; border-radius:999px; font-weight:700; font-size:15px; }
  #empty { text-align:center; opacity:.6; padding:40px 20px; }
  dialog { border:0; border-radius:16px; background:var(--card); color:var(--txt);
           width:min(560px,92vw); max-height:90vh; padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.8); }
  dialog h2 { margin-top:0; }
  label { display:block; margin:14px 0 6px; font-weight:600; }
  .row { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; align-items:center; }
  #viewer { width:100vw; max-width:100vw; height:100vh; max-height:100vh; margin:0; border-radius:0;
            background:#000; display:none; flex-direction:column; padding:env(safe-area-inset-top) 12px 12px; }
  #viewer[open] { display:flex; }
  #viewer .imgwrap { flex:1; min-height:0; position:relative; display:flex; }
  #viewer img { flex:1; min-height:0; width:100%; object-fit:contain; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:34px; width:60px; height:80px;
         background:rgba(255,255,255,.12); }
  #prevBtn { left:0; } #nextBtn { right:0; }
  #viewInfo { text-align:center; padding:8px; font-size:18px; }
  #viewPrice { color:var(--acc); font-size:26px; font-weight:700; display:block; }
  input[type=text] { font:inherit; font-size:17px; padding:10px; border-radius:10px; border:0; background:var(--mute);
                     color:var(--txt); flex:1; min-width:0; -webkit-user-select:text; user-select:text; }
  .catline { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--mute); }
  .catline span { flex:1; font-size:17px; }
  #count { opacity:.7; margin:8px 0; }
  .hint { opacity:.6; font-size:14px; margin:4px 0 0; }
</style>
</head>
<body>

<header>
  <div id="brand">
    <img id="logo" src="logo.png" alt="" onerror="this.style.display='none'">
    <h1 id="title">Mes dessins</h1>
  </div>
  <button class="icon admin" id="lockBtn" title="Mode convention">🔒</button>
  <button class="icon admin" id="catBtn" title="Réglages">⚙︎</button>
  <button class="icon primary admin" id="addBtn" title="Ajouter">＋</button>
</header>
<nav class="chips" id="filters"></nav>
<main id="grid"></main>
<p id="empty" hidden>Aucun dessin ici.</p>

<!-- Ajout -->
<dialog id="addDlg">
  <h2>Ajouter des dessins</h2>
  <button class="primary" id="pickBtn">📷 Choisir des photos</button>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <p id="count">0 photo sélectionnée</p>
  <label>Styles (plusieurs possibles)</label>
  <div class="chips wrap" id="addStyles"></div>
  <label>Prix (facultatif)</label>
  <input type="text" id="addPrice" placeholder="ex : 80 €  ou  à partir de 120 €">
  <p class="hint">Le même prix sera appliqué à toutes les photos sélectionnées. Modifiable ensuite.</p>
  <div class="row">
    <button id="addCancel">Annuler</button>
    <button class="primary" id="addOk">Valider</button>
  </div>
</dialog>

<!-- Visionneuse -->
<dialog id="viewer">
  <div class="imgwrap">
    <img id="viewImg" alt="">
    <button class="nav" id="prevBtn">‹</button>
    <button class="nav" id="nextBtn">›</button>
  </div>
  <div id="viewInfo"><span id="viewPrice"></span><span id="viewTags"></span></div>
  <div class="admin">
    <div class="row" style="justify-content:stretch;margin-top:4px">
      <input type="text" id="editPrice" placeholder="Prix (facultatif)">
      <button id="savePrice">💾 Prix</button>
    </div>
    <div class="chips wrap" id="viewStyles"></div>
  </div>
  <div class="row">
    <button class="danger admin" id="delBtn">Supprimer</button>
    <button class="primary" id="closeBtn">Fermer</button>
  </div>
</dialog>

<!-- Réglages -->
<dialog id="catDlg">
  <h2>Réglages</h2>
  <label>Titre affiché</label>
  <div class="row" style="justify-content:stretch;margin-top:0">
    <input type="text" id="titleInput" placeholder="ex : LP Ink">
    <button id="titleSave">OK</button>
  </div>
  <label>Catégories</label>
  <p class="hint">Astuce : touche 🌐 ou 😀 sur le clavier pour ajouter des smileys (ex : 🌸 Florale).</p>
  <div id="catList"></div>
  <div class="row" style="justify-content:stretch">
    <input type="text" id="catInput" placeholder="Nouvelle catégorie (ex : 🌙 Signe astro)">
    <button class="primary" id="catAdd">Ajouter</button>
  </div>
  <div class="row"><button id="catClose" class="primary">Terminé</button></div>
</dialog>

<script>
const DEFAULT_CATS = ["🌸 Florale","🌙 Signe astro","✨ Minimaliste","⚓ Old school","🐉 Japonais",
                      "✍️ Lettrage","🐾 Animaux","🔷 Géométrique","📷 Réaliste","❓ Autre"];
let cats = JSON.parse(localStorage.getItem("cats") || "null") || DEFAULT_CATS;
let filter = null, photos = [], db, pending = [], addSel = new Set(), current = null, viewList = [];
const urls = new Map();
const $ = id => document.getElementById(id);
const isLocked = () => localStorage.getItem("locked") === "1";

/* ---------- Titre ---------- */
function applyTitle() {
  const t = localStorage.getItem("title") || "Mes dessins";
  $("title").textContent = t;
}

/* ---------- Mode convention ---------- */
function applyLock() { document.body.classList.toggle("locked", isLocked()); }
$("lockBtn").onclick = () => {
  const code = prompt("Mode convention : les visiteurs pourront seulement regarder.\n\nChoisis un code pour déverrouiller (ex : 1234) :");
  if (!code) return;
  localStorage.setItem("code", code); localStorage.setItem("locked", "1"); applyLock(); render();
  alert("Verrouillé ✅\nPour déverrouiller : touche 5 fois le logo ou le titre, puis entre ton code.");
};
let taps = 0, tapTimer;
$("brand").onclick = () => {
  if (!isLocked()) return;
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 1500);
  if (taps >= 5) {
    taps = 0;
    const c = prompt("Code de déverrouillage :");
    if (c === null) return;
    if (c === localStorage.getItem("code")) { localStorage.setItem("locked", "0"); applyLock(); render(); }
    else alert("Code incorrect");
  }
};

/* ---------- Base de données locale (IndexedDB, uniquement sur l'iPad) ---------- */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("tattoos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "id" });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const store = mode => db.transaction("photos", mode).objectStore("photos");
const wait = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function loadAll() {
  photos = await wait(store("readonly").getAll());
  photos.forEach(p => { if (p.price === undefined) p.price = ""; });
  photos.sort((a, b) => b.date - a.date);
}
const savePhoto = p => wait(store("readwrite").put(p));
const saveCats = () => localStorage.setItem("cats", JSON.stringify(cats));

/* ---------- Prix : "80" devient "80 €" ---------- */
function fmtPrice(v) {
  v = (v || "").trim();
  if (!v) return "";
  return /^\d+([.,]\d+)?$/.test(v) ? v + " €" : v;
}

/* ---------- Réduction des images ---------- */
function resize(file) {
  return new Promise(res => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => res(b || file), "image/jpeg", 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(u); res(file); };
    img.src = u;
  });
}
function urlOf(p) {
  if (!urls.has(p.id)) urls.set(p.id, URL.createObjectURL(p.blob));
  return urls.get(p.id);
}

/* ---------- Affichage ---------- */
function chip(label, on, onClick) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.textContent = label; b.onclick = onClick;
  return b;
}
function render() {
  const f = $("filters"); f.innerHTML = "";
  f.append(chip(`Tous (${photos.length})`, filter === null, () => { filter = null; render(); }));
  cats.forEach(c => {
    const n = photos.filter(p => p.styles.includes(c)).length;
    if (n === 0 && isLocked()) return; // catégories vides cachées aux visiteurs
    f.append(chip(`${c} (${n})`, filter === c, () => { filter = c; render(); }));
  });
  viewList = filter ? photos.filter(p => p.styles.includes(filter)) : photos;
  const g = $("grid"); g.innerHTML = "";
  viewList.forEach((p, i) => {
    const tile = document.createElement("div"); tile.className = "tile";
    const img = document.createElement("img");
    img.src = urlOf(p); img.loading = "lazy";
    tile.onclick = () => openViewer(i);
    tile.append(img);
    const pr = fmtPrice(p.price);
    if (pr) { const b = document.createElement("span"); b.className = "price"; b.textContent = pr; tile.append(b); }
    g.append(tile);
  });
  $("empty").hidden = viewList.length > 0;
}

/* ---------- Ajout ---------- */
function renderAddStyles() {
  const box = $("addStyles"); box.innerHTML = "";
  cats.forEach(c => box.append(chip(c, addSel.has(c), () => {
    addSel.has(c) ? addSel.delete(c) : addSel.add(c); renderAddStyles();
  })));
}
$("addBtn").onclick = () => {
  pending = []; addSel = new Set(filter ? [filter] : []);
  $("count").textContent = "0 photo sélectionnée";
  $("addPrice").value = "";
  renderAddStyles(); $("addDlg").showModal();
};
$("pickBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => {
  pending = [...e.target.files];
  $("count").textContent = `${pending.length} photo(s) sélectionnée(s)`;
  e.target.value = "";
};
$("addCancel").onclick = () => $("addDlg").close();
$("addOk").onclick = async () => {
  if (!pending.length) { alert("Choisis au moins une photo."); return; }
  $("addOk").disabled = true; $("addOk").textContent = "Ajout…";
  const price = $("addPrice").value.trim();
  let t = Date.now();
  for (const f of pending) {
    const blob = await resize(f);
    await savePhoto({ id: String(t) + Math.random().toString(36).slice(2), blob,
                      styles: [...addSel], price, date: t++ });
  }
  $("addOk").disabled = false; $("addOk").textContent = "Valider";
  $("addDlg").close();
  await loadAll(); render();
};

/* ---------- Visionneuse ---------- */
let idx = 0;
function showCurrent() {
  current = viewList[idx];
  $("viewImg").src = urlOf(current);
  $("viewPrice").textContent = fmtPrice(current.price);
  $("viewTags").textContent = current.styles.join("  ·  ");
  $("editPrice").value = current.price || "";
  $("prevBtn").style.visibility = idx > 0 ? "visible" : "hidden";
  $("nextBtn").style.visibility = idx < viewList.length - 1 ? "visible" : "hidden";
  const box = $("viewStyles"); box.innerHTML = "";
  cats.forEach(c => box.append(chip(c, current.styles.includes(c), async () => {
    current.styles = current.styles.includes(c)
      ? current.styles.filter(s => s !== c) : [...current.styles, c];
    await savePhoto(current); showCurrent(); render();
  })));
}
function openViewer(i) { idx = i; showCurrent(); $("viewer").showModal(); }
function go(d) { const n = idx + d; if (n >= 0 && n < viewList.length) { idx = n; showCurrent(); } }
$("prevBtn").onclick = () => go(-1);
$("nextBtn").onclick = () => go(1);
let sx = null;
$("viewImg").addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
$("viewImg").addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
});
$("savePrice").onclick = async () => {
  current.price = $("editPrice").value.trim();
  await savePhoto(current); showCurrent(); render();
};
$("closeBtn").onclick = () => $("viewer").close();
$("delBtn").onclick = async () => {
  if (!confirm("Supprimer ce dessin ?")) return;
  await wait(store("readwrite").delete(current.id));
  URL.revokeObjectURL(urls.get(current.id)); urls.delete(current.id);
  $("viewer").close(); await loadAll(); render();
};

/* ---------- Réglages / catégories ---------- */
async function renameCat(oldName) {
  const n = (prompt("Nouveau nom (tu peux ajouter des smileys) :", oldName) || "").trim();
  if (!n || n === oldName) return;
  if (cats.includes(n)) { alert("Cette catégorie existe déjà."); return; }
  cats = cats.map(c => c === oldName ? n : c); saveCats();
  for (const p of photos) {
    if (p.styles.includes(oldName)) { p.styles = p.styles.map(s => s === oldName ? n : s); await savePhoto(p); }
  }
  if (filter === oldName) filter = n;
  renderCats(); render();
}
function moveCat(i, d) {
  const j = i + d; if (j < 0 || j >= cats.length) return;
  [cats[i], cats[j]] = [cats[j], cats[i]]; saveCats(); renderCats(); render();
}
function renderCats() {
  const l = $("catList"); l.innerHTML = "";
  cats.forEach((c, i) => {
    const line = document.createElement("div"); line.className = "catline";
    const s = document.createElement("span"); s.textContent = c;
    const up = document.createElement("button"); up.textContent = "↑"; up.onclick = () => moveCat(i, -1);
    const ren = document.createElement("button"); ren.textContent = "✏️"; ren.onclick = () => renameCat(c);
    const del = document.createElement("button"); del.className = "danger"; del.textContent = "✕";
    del.onclick = () => {
      if (!confirm(`Supprimer la catégorie « ${c} » ? (les dessins restent)`)) return;
      cats = cats.filter(x => x !== c); saveCats();
      if (filter === c) filter = null;
      renderCats(); render();
    };
    line.append(s, up, ren, del); l.append(line);
  });
}
$("catBtn").onclick = () => { $("titleInput").value = localStorage.getItem("title") || ""; renderCats(); $("catDlg").showModal(); };
$("titleSave").onclick = () => { localStorage.setItem("title", $("titleInput").value.trim()); applyTitle(); };
$("catAdd").onclick = () => {
  const v = $("catInput").value.trim();
  if (v && !cats.includes(v)) { cats.push(v); saveCats(); renderCats(); render(); }
  $("catInput").value = "";
};
$("catClose").onclick = () => $("catDlg").close();

/* ---------- Démarrage ---------- */
(async () => {
  applyTitle(); applyLock();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  db = await openDB();
  await loadAll(); render();
})();
</script>
</body>
</html>
